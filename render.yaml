services:
  # ── Backend API ───────────────────────────────────────────────
  - type: web
    name: 4evrcustoms-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma db push --accept-data-loss && npm run seed
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: 4evrcustoms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health

  # ── Web Admin (static site) ───────────────────────────────────
  - type: web
    name: 4evrcustoms-admin
    runtime: static
    region: oregon
    plan: starter
    rootDir: web-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: 4evrcustoms-db
    databaseName: evrcustoms
    user: evrcustoms_app
    region: oregon
    plan: starter
