services:
  # ── Backend API ───────────────────────────────────────────────
  - type: web
    name: 4evrcustoms-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run seed
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health

  # ── Web Admin (static site) ───────────────────────────────────
  - type: web
    name: 4evrcustoms-admin
    runtime: static
    rootDir: web-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    # Sin caché para los manifiestos, el service worker y los HTML: así un cambio de app instalable se aplica al instante
    headers:
      - path: /manifest-taller.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /manifest-cliente.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /cliente.html
        name: Cache-Control
        value: no-cache
    routes:
      # El portal de clientes tiene su propio HTML (manifiesto de PWA propio)
      - type: rewrite
        source: /cliente
        destination: /cliente.html
      - type: rewrite
        source: /cliente/*
        destination: /cliente.html
      - type: rewrite
        source: /*
        destination: /index.html



